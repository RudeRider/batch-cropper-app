<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direct Media Downloader — AssetSuite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050507;
      color: #fafafa;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .bento-panel {
      background: rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .ambient-spotlight {
      background: radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.12) 0%, rgba(5, 5, 7, 0) 70%);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black overflow-x-hidden">

  <!-- Top Ambient Spotlight -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-5xl h-[450px] ambient-spotlight pointer-events-none z-0"></div>

  <!-- Minimal Floating Navbar -->
  <header class="sticky top-4 z-30 px-6">
    <div class="max-w-5xl mx-auto h-14 px-5 rounded-2xl bg-zinc-950/75 backdrop-blur-xl border border-white/[0.08] flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3 group">
        <div class="w-8 h-8 rounded-lg bg-white/[0.05] border border-white/[0.1] flex items-center justify-center text-sm text-zinc-200 group-hover:border-cyan-500/50 group-hover:text-cyan-400 transition">
          <i class="fa-solid fa-arrow-left text-xs"></i>
        </div>
        <span class="text-sm font-semibold tracking-tight text-zinc-100">Asset<span class="text-zinc-500">Suite</span></span>
      </a>
      <div class="flex items-center space-x-2">
        <span class="text-[11px] font-medium text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-2.5 py-1 rounded-lg">
          <i class="fa-solid fa-bolt mr-1"></i> Direct Engine v2
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow flex flex-col items-center justify-center px-4 py-14 relative z-10">
    <div class="max-w-2xl w-full text-center space-y-4 mb-10">
      <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-white/[0.03] border border-white/[0.08] text-zinc-400 text-[11px] font-medium">
        <span>Supports YouTube, TikTok, Instagram, X & More</span>
      </div>
      <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-white">
        Download Media <span class="bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">Instantly.</span>
      </h1>
      <p class="text-zinc-400 text-sm max-w-md mx-auto">
        Paste any video, Shorts, Reel, or post link below to extract high-bitrate video, audio, or source thumbnails.
      </p>
    </div>

    <!-- Downloader Card -->
    <div class="bento-panel w-full max-w-2xl rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
      
      <!-- URL Input Area -->
      <div class="relative flex items-center">
        <div id="platform-icon" class="absolute left-4 text-zinc-400 text-lg">
          <i class="fa-solid fa-link"></i>
        </div>
        <input 
          type="url" 
          id="media-url" 
          placeholder="Paste YouTube, TikTok, Instagram, or X link here..." 
          class="w-full pl-12 pr-24 py-3.5 bg-zinc-900/90 border border-white/[0.08] rounded-xl focus:outline-none focus:border-cyan-500/60 text-sm text-white placeholder-zinc-500 transition"
          oninput="detectPlatform(this.value)"
        />
        <button 
          onclick="pasteClipboard()" 
          class="absolute right-2.5 px-3 py-1.5 text-xs font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg transition border border-white/[0.08]">
          <i class="fa-regular fa-paste mr-1"></i> Paste
        </button>
      </div>

      <!-- Format & Quality Controls -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-[11px] text-zinc-400 uppercase font-semibold tracking-wider mb-2">Format</label>
          <div class="grid grid-cols-3 gap-1.5 bg-zinc-900/90 p-1 rounded-xl border border-white/[0.08]">
            <button type="button" onclick="setFormat('video')" id="btn-video" class="format-btn bg-white text-black py-2 rounded-lg text-xs font-semibold transition">
              <i class="fa-solid fa-video mr-1"></i> Video
            </button>
            <button type="button" onclick="setFormat('audio')" id="btn-audio" class="format-btn text-zinc-400 hover:text-white py-2 rounded-lg text-xs font-medium transition">
              <i class="fa-solid fa-music mr-1"></i> Audio
            </button>
            <button type="button" onclick="setFormat('image')" id="btn-image" class="format-btn text-zinc-400 hover:text-white py-2 rounded-lg text-xs font-medium transition">
              <i class="fa-solid fa-image mr-1"></i> Image
            </button>
          </div>
        </div>

        <div>
          <label class="block text-[11px] text-zinc-400 uppercase font-semibold tracking-wider mb-2">Quality</label>
          <select id="media-quality" class="w-full py-2.5 px-3.5 bg-zinc-900/90 border border-white/[0.08] rounded-xl text-xs text-white focus:outline-none focus:border-cyan-500/60">
            <option value="1080">1080p Full HD</option>
            <option value="720">720p HD</option>
            <option value="max">4K / Max Source</option>
            <option value="480">480p Compact</option>
          </select>
        </div>
      </div>

      <!-- Action Button -->
      <button 
        onclick="processDownload()" 
        id="download-btn"
        class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-indigo-500 hover:from-cyan-400 hover:to-indigo-400 text-black font-bold rounded-xl shadow-lg shadow-cyan-500/15 transition flex items-center justify-center gap-2 text-sm">
        <i class="fa-solid fa-bolt"></i> Fetch Media
      </button>

      <!-- Status / Result Container -->
      <div id="result-area" class="hidden pt-5 border-t border-white/[0.08] space-y-4"></div>

    </div>

    <!-- Supported Platforms Strip -->
    <div class="mt-8 flex flex-wrap justify-center gap-6 text-zinc-600 text-xl">
      <i class="fa-brands fa-youtube hover:text-red-500 transition" title="YouTube"></i>
      <i class="fa-brands fa-instagram hover:text-pink-500 transition" title="Instagram"></i>
      <i class="fa-brands fa-tiktok hover:text-cyan-400 transition" title="TikTok"></i>
      <i class="fa-brands fa-x-twitter hover:text-white transition" title="X / Twitter"></i>
      <i class="fa-brands fa-facebook hover:text-blue-500 transition" title="Facebook"></i>
      <i class="fa-brands fa-pinterest hover:text-red-600 transition" title="Pinterest"></i>
      <i class="fa-brands fa-reddit hover:text-orange-500 transition" title="Reddit"></i>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-zinc-600 text-[11px] border-t border-white/[0.05]">
    <p>Digital Asset Tools Suite • Client-Side & Multi-Mirror Media Extractor</p>
  </footer>

  <!-- Frontend Logic -->
  <script>
    let currentFormat = 'video';

    // Public Cobalt API instances to try in order
    const COBALT_INSTANCES = [
      'https://cobalt-api.kwiatekmiki.com',
      'https://cobalt.api.timelessnesses.me',
      'https://api.cobalt.blackcat.sweeux.org'
    ];

    function detectPlatform(url) {
      const iconContainer = document.getElementById('platform-icon');
      const u = url.toLowerCase();
      if (u.includes('youtube.com') || u.includes('youtu.be')) {
        iconContainer.innerHTML = '<i class="fa-brands fa-youtube text-red-500"></i>';
      } else if (u.includes('instagram.com')) {
        iconContainer.innerHTML = '<i class="fa-brands fa-instagram text-pink-500"></i>';
      } else if (u.includes('tiktok.com')) {
        iconContainer.innerHTML = '<i class="fa-brands fa-tiktok text-cyan-400"></i>';
      } else if (u.includes('twitter.com') || u.includes('x.com')) {
        iconContainer.innerHTML = '<i class="fa-brands fa-x-twitter text-white"></i>';
      } else if (u.includes('facebook.com') || u.includes('fb.watch')) {
        iconContainer.innerHTML = '<i class="fa-brands fa-facebook text-blue-500"></i>';
      } else {
        iconContainer.innerHTML = '<i class="fa-solid fa-link text-zinc-400"></i>';
      }
    }

    function setFormat(format) {
      currentFormat = format;
      document.querySelectorAll('.format-btn').forEach(btn => {
        btn.className = 'format-btn text-zinc-400 hover:text-white py-2 rounded-lg text-xs font-medium transition';
      });
      const activeBtn = document.getElementById(`btn-${format}`);
      activeBtn.className = 'format-btn bg-white text-black py-2 rounded-lg text-xs font-semibold transition';
    }

    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        const input = document.getElementById('media-url');
        input.value = text;
        detectPlatform(text);
      } catch (err) {
        alert('Press Ctrl+V to paste your link.');
      }
    }

    // Helper: Extract YouTube Video ID
    function extractYouTubeID(url) {
      const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
      const match = url.match(regExp);
      if (match && match[7].length === 11) return match[7];
      // Check YouTube Shorts
      const shortsMatch = url.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/);
      return shortsMatch ? shortsMatch[1] : null;
    }

    async function processDownload() {
      const urlInput = document.getElementById('media-url').value.trim();
      const quality = document.getElementById('media-quality').value;
      const resultArea = document.getElementById('result-area');
      const btn = document.getElementById('download-btn');

      if (!urlInput) {
        alert('Please paste a valid link first!');
        return;
      }

      const ytId = extractYouTubeID(urlInput);

      // 1. If user picked "Image" mode on a YouTube link, extract 4K/HD covers immediately (100% client-side)
      if (currentFormat === 'image' && ytId) {
        resultArea.classList.remove('hidden');
        resultArea.innerHTML = renderYouTubeThumbnailCard(ytId);
        return;
      }

      // Show Loading State
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Extracting Stream...';
      resultArea.classList.remove('hidden');
      resultArea.innerHTML = `
        <div class="text-center py-4 text-zinc-400 text-xs animate-pulse">
          Querying media extraction nodes...
        </div>
      `;

      let streamData = null;

      // 2. Try Public Cobalt API Nodes
      for (const instance of COBALT_INSTANCES) {
        try {
          const response = await fetch(`${instance}/`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              url: urlInput,
              videoQuality: quality,
              downloadMode: currentFormat === 'audio' ? 'audio' : 'auto'
            })
          });

          if (response.ok) {
            const data = await response.json();
            if (data && (data.url || data.picker)) {
              streamData = data;
              break;
            }
          }
        } catch (e) {
          // Continue to next public node
        }
      }

      // 3. Render Direct Stream if found
      if (streamData && streamData.url) {
        resultArea.innerHTML = `
          <div class="bg-emerald-950/30 border border-emerald-500/30 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-emerald-500/20 flex items-center justify-center text-emerald-400">
                <i class="fa-solid fa-check"></i>
              </div>
              <div class="text-left">
                <h4 class="font-semibold text-white text-sm">Direct Stream Ready</h4>
                <p class="text-xs text-zinc-400">Mode: ${currentFormat.toUpperCase()} • Quality: ${quality === 'max' ? '4K/Max' : quality + 'p'}</p>
              </div>
            </div>
            <a href="${streamData.url}" target="_blank" download class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black text-xs font-bold rounded-lg transition shrink-0">
              <i class="fa-solid fa-download mr-1"></i> Download File
            </a>
          </div>
          ${ytId ? renderYouTubeThumbnailCard(ytId) : ''}
        `;
      } else {
        // 4. Smart Fallback: Show YouTube preview + Instant 1-Click External Mirrors so user can ALWAYS download
        resultArea.innerHTML = `
          ${ytId ? renderYouTubeThumbnailCard(ytId) : ''}
          <div class="bg-zinc-900/90 border border-white/[0.08] rounded-xl p-4 space-y-3 text-left">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-cyan-400 flex items-center gap-2">
                <i class="fa-solid fa-server"></i> Direct External Mirrors Ready
              </span>
              <span class="text-[10px] text-zinc-500">Bypass browser CORS block</span>
            </div>
            <p class="text-xs text-zinc-400 leading-relaxed">
              Click any mirror below to grab the <b>${currentFormat.toUpperCase()}</b> file directly (your link is automatically copied to clipboard):
            </p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1">
              <button onclick="openMirror('https://cobalt.tools/', '${urlInput}')" class="py-2.5 px-3 bg-white hover:bg-zinc-200 text-black font-semibold text-xs rounded-lg transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-bolt"></i> Cobalt (Ad-Free)
              </button>
              <button onclick="openMirror('https://ssyoutube.com/', '${urlInput}')" class="py-2.5 px-3 bg-zinc-800 hover:bg-zinc-700 text-white font-medium text-xs rounded-lg border border-white/[0.08] transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-cloud-arrow-down text-cyan-400"></i> SaveFrom Mirror
              </button>
              <button onclick="openMirror('https://y2mate.nu/', '${urlInput}')" class="py-2.5 px-3 bg-zinc-800 hover:bg-zinc-700 text-white font-medium text-xs rounded-lg border border-white/[0.08] transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-music text-indigo-400"></i> MP4 / MP3 Mirror
              </button>
            </div>
          </div>
        `;
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Fetch Media';
    }

    function renderYouTubeThumbnailCard(ytId) {
      const maxRes = `https://img.youtube.com/vi/${ytId}/maxresdefault.jpg`;
      const hqRes = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
      return `
        <div class="bg-zinc-900/90 border border-white/[0.08] rounded-xl p-4 flex flex-col sm:flex-row items-center gap-4 text-left">
          <img src="${maxRes}" onerror="this.src='${hqRes}'" class="w-full sm:w-36 h-20 object-cover rounded-lg border border-white/[0.08]" alt="Thumbnail" />
          <div class="flex-grow space-y-1">
            <span class="text-[10px] font-semibold uppercase tracking-wider text-emerald-400">YouTube Asset Detected</span>
            <h4 class="text-xs font-semibold text-white">Video ID: ${ytId}</h4>
            <p class="text-[11px] text-zinc-400">High-resolution source thumbnail extracted directly.</p>
          </div>
          <a href="${maxRes}" target="_blank" download="youtube-${ytId}.jpg" class="px-3.5 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium rounded-lg border border-white/[0.08] transition shrink-0">
            <i class="fa-solid fa-image mr-1 text-cyan-400"></i> Save HD Cover
          </a>
        </div>
      `;
    }

    function openMirror(mirrorBaseUrl, mediaUrl) {
      navigator.clipboard.writeText(mediaUrl).catch(() => {});
      // If it's a YouTube link and user clicks SaveFrom, use the direct ssyoutube trick
      if (mirrorBaseUrl.includes('ssyoutube') && mediaUrl.includes('youtube.com')) {
        const directSS = mediaUrl.replace('youtube.com', 'ssyoutube.com');
        window.open(directSS, '_blank');
        return;
      }
      window.open(mirrorBaseUrl, '_blank');
    }
  </script>
</body>
</html>
